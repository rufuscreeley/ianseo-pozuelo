name: Publicar web
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/publicar.yml"
  workflow_run:
    workflows: ["Actualizar resultados Ianseo"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/data
          rm -f _site/data/state.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
